[project]
name = "rag-document-worker"
version = "0.1.0"
description = "Async PDF ingestion pipeline: parse, chunk, embed, index"
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.9.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "pgvector>=0.3.4",
    "minio>=7.2.7",
    "httpx>=0.27.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "pymupdf>=1.24.9",
    "pdfplumber>=0.11.4",
    "pytesseract>=0.3.13",
    "Pillow>=10.0.0",
    "numpy>=1.26.4",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
