[project]
name = "rag-service"
version = "0.1.0"
description = "RAG query engine: query understanding, hybrid retrieval, reranking, streaming generation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "numpy>=1.26.4",
    "neo4j>=5.24.0",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0.0"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
