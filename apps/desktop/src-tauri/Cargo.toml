[package]
name = "smoke-monkey-desktop"
version = "0.1.0"
description = "Smoke Monkey Desktop — local-memory RAG chat, cross-platform Tauri shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "smoke_monkey_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
portable-pty = "0.9"
nix = { version = "0.30", features = ["signal", "process"] }
whoami = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
