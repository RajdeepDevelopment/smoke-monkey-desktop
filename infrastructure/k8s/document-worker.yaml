apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-worker
  namespace: rag-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-worker
  template:
    metadata:
      labels:
        app: document-worker
    spec:
      containers:
        - name: document-worker
          image: rag-platform/document-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: rag-platform-config
            - secretRef:
                name: rag-platform-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
