apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-platform-config
  namespace: rag-platform
data:
  RAG_ENV: "production"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "rag"
  POSTGRES_DB: "ragdb"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  NATS_URL: "nats://nats:4222"
  MINIO_ENDPOINT: "minio"
  MINIO_PORT: "9000"
  MINIO_BUCKET: "documents"
  MINIO_SECURE: "false"
  OLLAMA_BASE_URL: "http://ollama:11434"
  OLLAMA_CHAT_MODEL: "qwen3:8b"
  OLLAMA_EMBED_MODEL: "nomic-embed-text"
  OLLAMA_EMBED_DIMS: "768"
  RAG_SERVICE_URL: "http://rag-service:8000"
  CORS_ORIGINS: "https://rag.example.com"
  HYDE_ENABLED: "true"
  MULTI_QUERY_ENABLED: "true"
  RERANK_ENABLED: "false"
  CACHE_ENABLED: "true"
  QUERY_CACHE_TTL: "300"
  OCR_ENABLED: "false"
  TOP_K: "12"
  CHUNK_SIZE: "800"
  CHUNK_OVERLAP: "80"
