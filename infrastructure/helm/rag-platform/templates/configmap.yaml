apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rag-platform.name" . }}-config
  labels:
    {{- include "rag-platform.labels" . | nindent 4 }}
data:
  RAG_ENV: {{ .Values.config.ragEnv | quote }}
  POSTGRES_HOST: {{ .Values.config.postgresHost | quote }}
  POSTGRES_PORT: {{ .Values.config.postgresPort | quote }}
  POSTGRES_USER: {{ .Values.config.postgresUser | quote }}
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  NATS_URL: {{ .Values.config.natsUrl | quote }}
  MINIO_ENDPOINT: {{ .Values.config.minioEndpoint | quote }}
  MINIO_PORT: {{ .Values.config.minioPort | quote }}
  MINIO_BUCKET: {{ .Values.config.minioBucket | quote }}
  MINIO_SECURE: {{ .Values.config.minioSecure | quote }}
  OLLAMA_BASE_URL: {{ .Values.config.ollamaBaseUrl | quote }}
  OLLAMA_CHAT_MODEL: {{ .Values.config.ollamaChatModel | quote }}
  OLLAMA_EMBED_MODEL: {{ .Values.config.ollamaEmbedModel | quote }}
  OLLAMA_EMBED_DIMS: {{ .Values.config.ollamaEmbedDims | quote }}
  RAG_SERVICE_URL: {{ .Values.config.ragServiceUrl | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  HYDE_ENABLED: {{ .Values.config.hydeEnabled | quote }}
  MULTI_QUERY_ENABLED: {{ .Values.config.multiQueryEnabled | quote }}
  RERANK_ENABLED: {{ .Values.config.rerankEnabled | quote }}
  CACHE_ENABLED: {{ .Values.config.cacheEnabled | quote }}
  QUERY_CACHE_TTL: {{ .Values.config.queryCacheTtl | quote }}
  OCR_ENABLED: {{ .Values.config.ocrEnabled | quote }}
  TOP_K: {{ .Values.config.topK | quote }}
  CHUNK_SIZE: {{ .Values.config.chunkSize | quote }}
  CHUNK_OVERLAP: {{ .Values.config.chunkOverlap | quote }}
