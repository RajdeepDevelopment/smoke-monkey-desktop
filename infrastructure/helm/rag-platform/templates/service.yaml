{{- range $name, $svc := dict "api-gateway" (dict "port" 3000) "rag-service" (dict "port" 8000) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "rag-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ index $.Values.replicaCount $name }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.repository }}/{{ $name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: {{ include "rag-platform.name" $ }}-config
            - secretRef:
                name: {{ include "rag-platform.name" $ }}-secrets
          env:
            - name: PORT
              value: {{ $svc.port | quote }}
          livenessProbe:
            httpGet:
              path: {{ if eq $name "rag-service" }}/api/v1/health{{ else }}/api/health{{ end }}
              port: {{ $svc.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: {{ if eq $name "rag-service" }}/api/v1/health{{ else }}/api/health{{ end }}
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml (index $.Values.resources $name) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "rag-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: {{ $.Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{ end }}
